          <rect x="100" y="48" width="34" height="30" rx="6"/><rect x="140" y="48" width="34" height="30" rx="6"/>
          <rect x="180" y="48" width="34" height="30" rx="6"/><rect x="220" y="48" width="34" height="30" rx="6"/>
          <rect x="260" y="48" width="34" height="30" rx="6"/><rect x="300" y="48" width="34" height="30" rx="6"/>
          <rect x="340" y="48" width="34" height="30" rx="6"/><rect x="380" y="48" width="34" height="30" rx="6"/>
          <rect x="420" y="48" width="34" height="30" rx="6"/><rect x="460" y="48" width="34" height="30" rx="6"/>
        </g>
