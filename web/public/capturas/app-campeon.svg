<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Maqueta de Coach LoL IA: vista Campeón</title>
  <desc id="d">Maqueta (no es una captura real) de la ventana principal: barra lateral, cabecera con Ahri en el rol Central, runas, hechizos, objetos, orden de habilidades y botón Importar.</desc>
  <defs>
    <linearGradient id="arte" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a6b"/>
      <stop offset="0.45" stop-color="#7a3f8f"/>
      <stop offset="1" stop-color="#1a2236"/>
    </linearGradient>
    <linearGradient id="velo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0a0e1a" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.75" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#ff9ad5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9ad5" stop-opacity="0"/>
