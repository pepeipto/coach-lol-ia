    <text x="44" y="25" font-size="13" font-weight="600" class="t">Coach LoL IA</text>
    <text x="600" y="25" font-size="12" class="s" text-anchor="middle">Selección de campeón · Clasificatoria Solo/Dúo</text>
    <g stroke="#8b97b8" stroke-width="1.6">
