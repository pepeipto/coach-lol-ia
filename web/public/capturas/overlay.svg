<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Maqueta del overlay de Coach LoL IA en partida</title>
  <desc id="d">Maqueta (no es una captura real): sobre una escena de partida esquemática, un panel compacto muestra la próxima compra y el próximo objetivo, y un aviso emergente dice «Nivel 4: sube la Q».</desc>
  <defs>
    <radialGradient id="suelo" cx="0.45" cy="0.55" r="0.8">
      <stop offset="0" stop-color="#2c3b2a"/>
      <stop offset="0.6" stop-color="#1b261d"/>
      <stop offset="1" stop-color="#0c120e"/>
    </radialGradient>
    <linearGradient id="rio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4a5c"/>
      <stop offset="1" stop-color="#14323f"/>
    </linearGradient>
    <clipPath id="marco"><rect width="1200" height="675" rx="14"/></clipPath>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', system-ui, sans-serif; }
  </style>
  <g clip-path="url(#marco)">
    <rect width="1200" height="675" fill="url(#suelo)"/>
    <!-- Escena de juego esquemática (no es arte de Riot) -->
    <path d="M-20 520C200 470 330 420 470 330S760 150 1220 120V-20H-20Z" fill="#16201a" opacity="0.7"/>
    <path d="M-20 430C180 420 330 380 520 300S860 220 1220 260" fill="none" stroke="url(#rio)" stroke-width="70" opacity="0.8"/>
    <g fill="#24331f" opacity="0.9">
      <circle cx="160" cy="180" r="60"/><circle cx="240" cy="150" r="40"/><circle cx="980" cy="520" r="70"/>
      <circle cx="1080" cy="470" r="44"/><circle cx="720" cy="560" r="50"/>
    </g>
    <g>
      <ellipse cx="560" cy="398" rx="26" ry="10" fill="#000" opacity="0.4"/>
      <circle cx="560" cy="372" r="20" fill="#c48bff"/>
      <rect x="530" y="330" width="60" height="7" rx="3" fill="#0a0e1a"/>
      <rect x="531" y="331" width="44" height="5" rx="2" fill="#2fbf71"/>
      <ellipse cx="760" cy="300" rx="22" ry="8" fill="#000" opacity="0.4"/>
      <circle cx="760" cy="278" r="16" fill="#ef5b5b" opacity="0.85"/>
      <rect x="735" y="246" width="50" height="6" rx="3" fill="#0a0e1a"/>
      <rect x="736" y="247" width="26" height="4" rx="2" fill="#ef5b5b"/>
    </g>
    <!-- HUD esquemático -->
    <rect x="360" y="600" width="480" height="75" rx="10" fill="#0d1110" stroke="#3b3424"/>
    <g fill="#1b1f1c" stroke="#3b3424">
      <rect x="390" y="614" width="44" height="44" rx="6"/><rect x="444" y="614" width="44" height="44" rx="6"/>
      <rect x="498" y="614" width="44" height="44" rx="6"/><rect x="552" y="614" width="44" height="44" rx="6"/>
    </g>
    <text x="780" y="644" font-size="16" font-weight="700" fill="#f0b429" text-anchor="end">1250</text>
    <rect x="1030" y="505" width="160" height="160" rx="6" fill="#0d1a14" stroke="#3b3424"/>
    <text x="1180" y="28" font-size="14" fill="#e8ecf5" text-anchor="end" opacity="0.8">04:00</text>

    <!-- Overlay: panel compacto -->
    <g transform="translate(24 24) scale(1.4)">
      <rect width="330" height="138" rx="12" fill="#0a0e1a" fill-opacity="0.88" stroke="#26314d"/>
      <path d="M18 18 28 24v12l-10 6-10-6V24Z" transform="translate(0 -2)" fill="none" stroke="#c8aa6e" stroke-width="2"/>
      <text x="38" y="27" font-size="12" font-weight="700" fill="#c8aa6e" letter-spacing="1.2">COACH</text>
      <text x="312" y="27" font-size="11" fill="#8b97b8" text-anchor="end">Ctrl+Mayús+O</text>
      <text x="18" y="62" font-size="11" fill="#8b97b8">PRÓXIMA COMPRA</text>
      <text x="18" y="82" font-size="14" font-weight="600" fill="#e8ecf5">Códice Demoníaco (1250 de oro)</text>
      <text x="18" y="108" font-size="11" fill="#8b97b8">PRÓXIMO OBJETIVO</text>
      <text x="18" y="127" font-size="14" font-weight="600" fill="#e8ecf5">El dragón aparece en 60 s</text>
    </g>

    <!-- Overlay: aviso emergente -->
    <g transform="translate(560 60) scale(1.3)">
      <rect width="380" height="58" rx="12" fill="#121829" fill-opacity="0.95" stroke="#4f7cff" stroke-opacity="0.7"/>
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#4f7cff"/>
      <circle cx="34" cy="29" r="14" fill="#4f7cff" fill-opacity="0.18"/>
      <text x="34" y="34" font-size="13" font-weight="800" fill="#7fa0ff" text-anchor="middle">Q</text>
      <text x="60" y="34" font-size="16" font-weight="600" fill="#e8ecf5">Nivel 4: sube la Q</text>
      <text x="364" y="34" font-size="12" fill="#8b97b8" text-anchor="end">voz</text>
    </g>

    <g transform="translate(24 610)">
      <rect width="136" height="28" rx="14" fill="#f0b429" fill-opacity="0.12" stroke="#f0b429" stroke-opacity="0.6"/>
      <text x="68" y="19" font-size="12" font-weight="700" fill="#f0b429" text-anchor="middle">MAQUETA</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="674" rx="14" fill="none" stroke="#26314d"/>
</svg>
