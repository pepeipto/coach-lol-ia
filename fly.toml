# Despliegue del servidor de Coach LoL IA en Fly.io.
# Se construye desde la raíz del monorepo con server/Dockerfile:  fly deploy --remote-only
app = "coachlolia-api"
primary_region = "fra"

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  PUERTO = "8080"
  RUTA_DB = "/datos/coach.db"
  URL_WEB = "https://www.coachlolia.com"
  # Fly.io añade un único salto de proxy (fly-proxy) delante de la app.
  TRUST_PROXY = "1"

# Secretos (no van aquí; se configuran con `fly secrets set`):
#   RIOT_API_KEY, PRUEBA_SAL, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID, ANTHROPIC_API_KEY

[[mounts]]
  source = "datos"
  destination = "/datos"

[http_service]
  internal_port = 8080
  force_https = true
  # Una sola máquina siempre encendida: el recolector corre cada 6 h y la base es SQLite en un volumen.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/salud"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
