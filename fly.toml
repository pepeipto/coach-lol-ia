# Despliegue del servidor de Coach LoL IA en Fly.io.
# Se construye desde la raíz del monorepo con server/Dockerfile:  fly deploy --remote-only
app = "coachlolia-api"
primary_region = "fra"

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  PUERTO = "8080"
  RUTA_DB = "/datos/coach.db"
  URL_WEB = "https://www.coachlolia.com"
  # Fly.io añade un único salto de proxy (fly-proxy) delante de la app.
  TRUST_PROXY = "1"
  # Partidas nuevas por región en cada ciclo de 6 h (con clave de desarrollo caben unas 3000).
  MAX_PARTIDAS = "3000"
  # Coach con IA (3.3): topes globales de gasto entre todos los usuarios (peor caso ~10 USD/día).
  COACH_IA_ANALISIS_MAX_HORA = "40"
  COACH_IA_ANALISIS_MAX_DIA = "200"
  COACH_IA_CONSEJO_MAX_HORA = "400"
  COACH_IA_CONSEJO_MAX_DIA = "3000"
  COACH_IA_PERSONAL_MAX_HORA = "60"
  COACH_IA_PERSONAL_MAX_DIA = "400"
  # Seguridad (25-10-2026): topes de las demás rutas de IA, prudentes para un proyecto gratuito. Peor caso aproximado
  # (salida llena, precios de Sonnet 5.5) entre paréntesis; la justificación completa está en server/src/topes.ts.
  # Asistente de soporte (Sonnet, historial recortado, ~0,012 USD por respuesta): 60/h y 300/día (~3,6 USD/día).
  ASISTENTE_MAX_HORA = "60"
  ASISTENTE_MAX_DIA = "300"
  # Ficha del campeón (~0,09 USD cada una, se guarda por versión): 100/día (~9 USD) y 15 por IP.
  FICHA_MAX_DIA = "100"
  FICHA_IP_DIA = "15"
  # Claves del cruce (~0,07 USD cada una, cientos de miles de cruces posibles): 120/día (~8 USD) y 20 por IP.
  CRUCE_CONSEJOS_MAX_DIA = "120"
  CRUCE_CONSEJOS_IP_DIA = "20"
  # Novedades del parche (5 idiomas por parche): 10/día (~1,6 USD).
  PARCHE_MAX_DIA = "10"

# Secretos (no van aquí; se configuran con `fly secrets set`):
#   RIOT_API_KEY, PRUEBA_SAL, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID, ANTHROPIC_API_KEY

[[mounts]]
  source = "datos"
  destination = "/datos"

[http_service]
  internal_port = 8080
  force_https = true
  # Una sola máquina siempre encendida: el recolector corre cada 6 h y la base es SQLite en un volumen.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/salud"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
