appId: com.coachlolia.app
productName: Coach LoL IA
directories:
  output: dist
files:
  - out/**
  - package.json
  - '!node_modules/.cache'
  # 3.1: de ONNX Runtime (voz natural) solo hace falta Windows x64 y sin DirectML (se usa la CPU).
  - '!**/node_modules/onnxruntime-node/bin/napi-v*/{darwin,linux}/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v*/win32/x64/{DirectML,dxcompiler,dxil}.dll'
# El módulo nativo y sus DLL no pueden cargarse desde dentro del asar.
asarUnpack:
  - '**/node_modules/onnxruntime-node/**'
# 3.6: icono de la app (build/icon.ico) y de la bandeja (resources/*.png).
extraResources:
  - from: resources
    to: .
    filter:
      - '*.png'
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 3.6: instalador en los 5 idiomas de la app; elige el del sistema (sin él, inglés).
  installerLanguages:
    - es_ES
    - en_US
    - pt_BR
    - fr_FR
    - de_DE
  multiLanguageInstaller: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
publish:
  provider: github
  owner: pepeipto
  repo: coach-lol-ia
