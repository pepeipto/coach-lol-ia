appId: com.coachlolia.app
productName: Coach LoL IA
directories:
  output: dist
files:
  - out/**
  - package.json
  - '!node_modules/.cache'
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Instalador en español (3082 = es-ES, alfabetización internacional).
  installerLanguages:
    - es_ES
  language: '3082'
publish:
  provider: github
  owner: pepeipto
  repo: coach-lol-ia
