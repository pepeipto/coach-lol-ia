appId: com.coachlolia.app
productName: Coach LoL IA
directories:
  output: dist
files:
  - out/**
  - package.json
  - '!node_modules/.cache'
  # 3.1: de ONNX Runtime (voz natural) solo hace falta Windows x64 y sin DirectML (se usa la CPU).
  - '!**/node_modules/onnxruntime-node/bin/napi-v*/{darwin,linux}/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v*/win32/x64/{DirectML,dxcompiler,dxil}.dll'
# El módulo nativo y sus DLL no pueden cargarse desde dentro del asar.
asarUnpack:
  - '**/node_modules/onnxruntime-node/**'
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Instalador en español (3082 = es-ES, alfabetización internacional).
  installerLanguages:
    - es_ES
  language: '3082'
publish:
  provider: github
  owner: pepeipto
  repo: coach-lol-ia
