# Escaneo de secretos con gitleaks: busca claves (Riot, Anthropic, Stripe, ElevenLabs, tokens...) en los commits
# nuevos de cada push y PR, y en todo el historial una vez por semana. Si encuentra algo, el job falla.
# Los falsos positivos conocidos se excluyen en .gitleaks.toml. Se descarga el binario oficial con su SHA-256
# fijado (sin acciones de terceros ni licencias).
name: Secretos

on:
  push:
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.28.0
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archivo"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archivo" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archivo" -C "$RUNNER_TEMP" gitleaks
      - name: Buscar secretos
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Push: solo los commits nuevos; PR: los del PR; semanal, manual, rama nueva o push forzado: todo el historial.
          rango=""
          if [ "$EVENTO" = "pull_request" ]; then
            rango="$BASE..$CABEZA"
          elif [ "$EVENTO" = "push" ] && [ -n "$ANTES" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            rango="$ANTES..$GITHUB_SHA"
          fi
          if [ -n "$rango" ]; then
            "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts="$rango"
          else
            "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
          fi
