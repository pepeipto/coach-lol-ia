name: CI
on: [push, pull_request]
# El GITHUB_TOKEN solo necesita leer el código.
permissions:
  contents: read
jobs:
  probar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm 12 bloquea los scripts de instalación por defecto (better-sqlite3, esbuild, electron).
      - run: npm ci --dangerously-allow-all-scripts
      - run: npx tsc --noEmit -p shared
      - run: npx tsc --noEmit -p server
      - run: npx tsc --noEmit -p app
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t coach-lol-ia-server .
      # better-sqlite3 tiene que cargar dentro de la imagen.
      - run: docker run --rm --entrypoint node coach-lol-ia-server -e "new (require('better-sqlite3'))(':memory:').close(); console.log('better-sqlite3 OK')"
