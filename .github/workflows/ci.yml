name: CI
on: [push, pull_request]
# Seguridad (hallazgo 15): solo lectura y acciones fijadas por SHA (la versión va en el comentario).
permissions:
  contents: read
jobs:
  probar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # npm 12 bloquea los scripts de instalación que no estén en allowScripts (package.json): solo esbuild.
      - run: npm ci --strict-allow-scripts
      - run: npx tsc --noEmit -p shared
      - run: npx tsc --noEmit -p app
      - run: npm test

  discord:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/discord
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
