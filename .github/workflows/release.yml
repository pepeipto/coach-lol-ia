# Release de Coach LoL IA: compila el instalador en GitHub Actions a partir del código de la etiqueta (build
# verificable), lo firma con Microsoft Artifact Signing (cuando esté configurado) y lo publica en GitHub Releases
# con latest.yml (actualizaciones automáticas) y SHA256SUMS.txt.
#
# Se lanza al subir una etiqueta vX.Y.Z (git push origin vX.Y.Z) o a mano (Actions → Release → Run workflow; a mano solo
# compila y deja los archivos como artefacto, salvo que se marque «publicar»).
# La release se crea como BORRADOR: se publica a mano tras revisarla.
#
# Firma con Microsoft Artifact Signing (antes «Azure Trusted Signing»), opcional hasta que esté configurada:
# - electron-builder firma la app (Coach LoL IA.exe), el desinstalador y el instalador, así que el Control
#   inteligente de aplicaciones de Windows no bloquea ni la instalación ni la app instalada.
# - Entra en Azure con OpenID Connect (sin contraseñas guardadas en GitHub): el trabajo usa el entorno «firma» y en
#   Azure hay una credencial federada para repo:pepeipto/coach-lol-ia:environment:firma.
# - Los datos de Azure van en el bloque «env» de abajo (no son secretos: sin la credencial federada no sirven de
#   nada). Ver docs/firma-azure.md.
# Con AZURE_FIRMA_CUENTA vacío, la release sale sin firmar, como hasta ahora.
#
# Firma con SignPath Foundation (en espera; solo se usa si se configura y Azure no lo está):
# - Variable SIGNPATH_ORGANIZATION_ID y secreto SIGNPATH_API_TOKEN (ver docs/firma-signpath.md).
#
# Seguridad (auditoría del 25-10-2026, hallazgos 2 y 15):
# - Dos trabajos. «compilar» ejecuta npm y el código de las dependencias, pero solo tiene permiso de lectura y el
#   checkout no guarda el token en .git/config. «publicar» no ejecuta npm ni hace checkout: solo descarga el artefacto
#   ya compilado y crea la release con permiso de escritura. Así, un paquete npm comprometido no puede tocar releases.
# - Solo esbuild puede ejecutar scripts de instalación (allowScripts en package.json). Los de better-sqlite3 (usa sus
#   binarios precompilados de prebuilds/), onnxruntime-node (en Windows sus binarios vienen en el paquete; el script
#   solo descarga CUDA para Linux), electron-winstaller (es para Squirrel y el instalador es NSIS) y koffi (3.19: su
#   binario de Windows viene ya compilado en @koromix/koffi-win32-x64; el script solo lo compilaría) están denegados.
#   Electron 44 ya no tiene postinstall: electron-builder descarga su propio Electron. --strict-allow-scripts hace fallar la
#   compilación si aparece una dependencia nueva con scripts sin revisar (se revisa con `npm approve-scripts`).
# - Las acciones de terceros están fijadas por SHA (la versión va en el comentario).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Crear o actualizar la release en GitHub (si no, solo compila y deja los archivos como artefacto)'
        type: boolean
        default: false

# Por defecto, nada; cada trabajo pide lo suyo.
permissions: {}

# Firma con Microsoft Artifact Signing. Vacío = sin firmar. Se rellena cuando Microsoft valide la empresa.
env:
  AZURE_TENANT_ID: ''
  AZURE_SUBSCRIPTION_ID: ''
  # Aplicación de Entra ID con la credencial federada de GitHub y el rol «Artifact Signing Certificate Profile Signer».
  AZURE_CLIENT_ID: ''
  # Endpoint de la región de la cuenta (North Europe: https://neu.codesigning.azure.net/).
  AZURE_FIRMA_ENDPOINT: ''
  AZURE_FIRMA_CUENTA: ''
  AZURE_FIRMA_PERFIL: ''
  # Nombre del editor EXACTO como sale en el certificado: electron-updater solo acepta actualizaciones firmadas por él.
  AZURE_FIRMA_EDITOR: ''

jobs:
  compilar:
    runs-on: windows-latest
    # Entorno fijo para la credencial federada de Azure (el «subject» de OIDC no cambia con cada etiqueta).
    environment: firma
    permissions:
      contents: read
      # Solo para entrar en Azure con OIDC (firma). Sin las variables de Azure no se usa.
      id-token: write
      # SignPath descarga el instalador sin firmar como artefacto de esta ejecución.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # La app instalada usa esta URL para builds, pantalla de carga e IA (sin ella, la compilación se detiene).
      COACH_SERVIDOR: ${{ vars.COACH_SERVIDOR || 'https://api.coachlolia.com' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # npm 12 bloquea los scripts de instalación que no estén en allowScripts (package.json): solo esbuild.
      - run: npm ci --strict-allow-scripts

      - name: Comprobar tipos y pruebas
        run: |
          npx tsc --noEmit -p shared
          npx tsc --noEmit -p server
          npx tsc --noEmit -p app
          npm test

      - name: Versión
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "La etiqueta $env:GITHUB_REF_NAME no coincide con app/package.json ($v)"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      # Firma con Microsoft Artifact Signing: sesión de Azure con OIDC para Invoke-TrustedSigning (electron-builder).
      - name: Entrar en Azure (firma)
        if: ${{ env.AZURE_FIRMA_CUENTA != '' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Compilar el instalador
        working-directory: app
        shell: pwsh
        run: |
          npm run build
          if (-not (Select-String -Path out/main/index.js -Pattern ([regex]::Escape("URL_COMPILADA = `"$env:COACH_SERVIDOR`"")) -Quiet)) {
            throw "La URL del servidor no quedó fijada en la compilación"
          }
          # electron-builder descarga sus herramientas (NSIS, winCodeSign) de GitHub; si esa descarga da un error
          # pasajero (p. ej. 504 el 8-11-2026), se reintenta hasta 4 veces con esperas crecientes.
          $env:DEBUG = 'electron-builder'
          $argumentos = @('--win', '--publish', 'never')
          if ($env:AZURE_FIRMA_CUENTA) {
            foreach ($n in 'AZURE_FIRMA_ENDPOINT', 'AZURE_FIRMA_PERFIL', 'AZURE_FIRMA_EDITOR') {
              if (-not (Get-Item "env:$n" -ErrorAction SilentlyContinue).Value) { throw "Falta la variable $n para firmar con Azure" }
            }
            Write-Host "Firma con Microsoft Artifact Signing: cuenta $env:AZURE_FIRMA_CUENTA, perfil $env:AZURE_FIRMA_PERFIL"
            $argumentos += @(
              "-c.win.azureSignOptions.endpoint=$env:AZURE_FIRMA_ENDPOINT",
              "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_FIRMA_CUENTA",
              "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_FIRMA_PERFIL",
              "-c.win.azureSignOptions.publisherName=$env:AZURE_FIRMA_EDITOR"
            )
          }
          $intento = 0
          while ($true) {
            $intento++
            npx electron-builder @argumentos
            if ($LASTEXITCODE -eq 0) { break }
            if ($intento -ge 4) { throw "electron-builder falló $intento veces" }
            $espera = 30 * $intento
            Write-Host "electron-builder falló (intento $intento); reintento en $espera s"
            Start-Sleep -Seconds $espera
          }
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force publicar | Out-Null
          Copy-Item "dist/Coach LoL IA Setup $v.exe" "publicar/Coach-LoL-IA-Setup-$v.exe"
          if ($env:AZURE_FIRMA_CUENTA) {
            foreach ($f in "dist/win-unpacked/Coach LoL IA.exe", "publicar/Coach-LoL-IA-Setup-$v.exe") {
              $firma = Get-AuthenticodeSignature $f
              if ($firma.Status -ne 'Valid') { throw "La firma de $f no es válida: $($firma.Status)" }
              Write-Host "$f firmado por: $($firma.SignerCertificate.Subject)"
            }
          }

      - name: Subir el instalador sin firmar
        id: sinfirmar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-sin-firmar
          path: app/publicar/Coach-LoL-IA-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Firmar con SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && env.AZURE_FIRMA_CUENTA == '' }}
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: coach-lol-ia
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.sinfirmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: app/firmado

      - name: Usar el instalador firmado
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && env.AZURE_FIRMA_CUENTA == '' }}
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $firmado = Get-ChildItem app/firmado -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $firmado) { throw "SignPath no devolvió el instalador firmado" }
          Copy-Item $firmado.FullName "app/publicar/Coach-LoL-IA-Setup-$v.exe" -Force
          $firma = Get-AuthenticodeSignature "app/publicar/Coach-LoL-IA-Setup-$v.exe"
          if ($firma.Status -ne 'Valid') { throw "La firma del instalador no es válida: $($firma.Status)" }

      # El blockmap y latest.yml se rehacen con el instalador final (firmado o no): electron-updater comprueba su sha512.
      - name: latest.yml, blockmap y SHA256SUMS
        run: node app/tools/tras-firmar.cjs "app/publicar/Coach-LoL-IA-Setup-${{ steps.version.outputs.version }}.exe" ${{ steps.version.outputs.version }}

      - name: Guardar los archivos finales
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: app/publicar/
          if-no-files-found: error

  publicar:
    needs: compilar
    if: ${{ github.event_name == 'push' || inputs.publicar }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Sin checkout y sin npm: solo los archivos que dejó el trabajo «compilar».
      - name: Descargar los archivos finales
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.compilar.outputs.version }}
          path: publicar

      - name: Crear la release (borrador)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.compilar.outputs.version }}
        run: |
          $v = $env:VERSION
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Versión no válida: $v" }
          $archivos = @(
            "publicar/Coach-LoL-IA-Setup-$v.exe",
            "publicar/Coach-LoL-IA-Setup-$v.exe.blockmap",
            "publicar/latest.yml",
            "publicar/SHA256SUMS.txt"
          )
          foreach ($a in $archivos) { if (-not (Test-Path $a)) { throw "Falta $a en el artefacto" } }
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$v" @archivos --clobber
          } else {
            gh release create "v$v" @archivos --draft --title "Coach LoL IA $v" --notes "Instalador compilado en GitHub Actions desde la etiqueta v$v. SHA-256 en SHA256SUMS.txt."
          }
